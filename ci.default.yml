schemaVersion: v0.2
prepare:
  steps:
    - name: ""
      command: fnm install lts/latest --use
test:
  steps: []
run:
  service:
    plan: 202
    replicas: 1
    network:
      ports:
        - port: 3000
          isPublic: false
      paths:
        - port: 3000
          path: /
    env:
      APP_VERSION: ${{ workspace.env['APP_VERSION'] }}
      colorSchema: ${{ workspace.env['colorSchema'] }}
      TENANT_NAME: ${{ workspace.env['TENANT_NAME'] }}
    steps:
      - command: node server.js
