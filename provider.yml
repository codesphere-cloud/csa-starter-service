name: starter-service
schemaVersion: v1
author: Bright Systems
category: Development
displayName: Starter Service
iconUrl: https://www.vectorlogo.zone/logos/nodejs/nodejs-icon.svg
description: |
  Simple Starter Service in Node.js to showcase the provider.yaml
  
capabilities:
  backups: false
  highAvailability: false
  pause: false
  pointInTimeRecovery: false

versions:
  0.0.1:
    ciProfile: default
    gitRef: main
    description: ""

backend:
  landscape:
    ciProfile: default

configSchema:
  type: object
  properties:
    TENANT_NAME:
      type: string
      description: Display name for the tenant using the Service
    APP_VERSION:
      type: string
      description: Version of the App deployed
      enum: ['1.0', '2.0']
      default: '1.0'
    colorSchema:
      type: string
      description: Color scheme for the frontend
      enum: ['default', 'high-contrast', 'dark']
      default: 'default'

detailsSchema:
  type: object
  properties: {}
             
secretsSchema: {}

plans: []
