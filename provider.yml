name: csa-starter-service
schemaVersion: v1
backend:
  landscape:
    gitUrl: https://github.com/codesphere-cloud/csa-starter-service
author: Codesphere
capabilities:
  backups: false
  highAvailability: false
  pause: false
  pointInTimeRecovery: false
category: Demo
description: Simple Starter Service in Node.js to showcase the provider.yml
displayName: Starter Service
iconUrl: https://www.vectorlogo.zone/logos/nodejs/nodejs-icon.svg
configSchema:
  type: object
  properties:
    APP_VERSION:
      type: string
    colorSchema:
      type: string
      enum:
        - high-contrast
        - dark
        - defaul
    TENANT_NAME:
      type: string
  required:
    - APP_VERSION
    - colorSchema
    - TENANT_NAME
  additionalProperties: false
detailsSchema:
  type: object
  properties:
    hostname:
      type: string
      format: uri
  additionalProperties: false
secretsSchema:
  type: object
  properties: {}
resourceParameters: {}
plans: []
versions:
  0.0.1:
    ciProfile: default
    gitRef: main
    description: ""
